title: "Budi Arsana | Technical Lead Engineer | AI Native | AWS Cloud"
author: "Budi Arsana"
url: "https://gusdecool.github.io"

# This will show up in places like twitter, linkedin, etc, if you share your sites url as a post.
description: "Technical lead engineer, specializing in backend technology, aggregator engine, GIS Spatial, and AI/ML."

# Email / Social media user names used by the minima theme:
# All of these are optional and can be removed or commented out
#email: "example@mail.com"
#twitter_username: "twitteruser"
github_username: "gusdecool"
linkedin_username: "gusdecool"
#facebook_username: username
#flickr_username: username
#instagram_username: username
#pinterest_username: username
#youtube_username: username
#googleplus_username: +username

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true

minima:
  show_excerpts: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Folders here are never built into the site, even if a file inside them
# would otherwise be picked up as a page.
exclude:
  - wip

titles_from_headings:
  strip_title: true
  collections: true

collections:
  portfolio:
    output: true
    permalink: /portfolio/:slug/

defaults:
  # Default social-share preview image (og:image / twitter:image via jekyll-seo-tag),
  # unless a page/post overrides it with its own `image:` front matter. No `type` filter
  # so it applies to pages, posts, and every collection (jekyll-seo-tag only reads
  # page-level front matter, not top-level site config, so this can't live as a plain
  # `image:` key above).
  - scope:
      path: ""
    values:
      image: /image/avatar.jpg
  - scope:
      path: ""
      type: post
    values:
      tags: Other
  - scope:
      path: ""
      type: portfolio
    values:
      layout: portfolio
